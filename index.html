<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play and Learn</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: white; text-align: center; margin: 0; padding: 20px; }
        .card { background: #16213e; padding: 20px; border-radius: 12px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #0F3460; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 5px; }
        button:hover { background: #e94560; }
        .free-tag { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎮 Play and Learn 🎮</h1>
    <div class="card">
        <h2>Hoş Geldiniz!</h2>
        <p>Oyun alanı hazır. Verileriniz cihazınızda saklanır (localStorage).</p>
        <p>Durum: <span class="free-tag">ÜCRETSİZ & DOĞRULANDI</span></p>
    </div>
</body>
</html>
