<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play and Learn App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --panel-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Üst Header Bar */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .welcome-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Market Paneli */
        #market-panel {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: none;
            z-index: 90;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #market-panel.active {
            display: block;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .market-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        /* Envanter Paneli */
        #inventory-panel {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: none;
            z-index: 85;
        }

        #inventory-panel.active {
            display: block;
        }

        /* Ana Alan */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* Doğrulama / Test Modalı */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        /* Oyun Konteynerleri ve Canvas */
        .game-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        canvas {
            background: #020617;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .touch-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
            padding: 0 10px;
        }

        .touch-group {
            display: flex;
            gap: 10px;
        }

        .touch-btn {
            width: 65px;
            height: 65px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Hesap Doğrulama / Creative Player Test Modalı -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-title">Hesap Seçimi</h2>
            <p id="modal-desc" style="margin: 10px 0; font-size: 0.9rem;">Değiştirmek için hesap adınızı girin:</p>
            <input type="text" id="username-input" placeholder="Kullanıcı adı (örn: creative player)...">
            <button class="btn" onclick="handleAccountSubmit()" style="width: 100%; margin-top: 10px;">Devam Et</button>
        </div>
    </div>

    <!-- Üst Header -->
    <header>
        <div class="header-left">
            <div class="welcome-title" id="welcome-display">Welcome Guest</div>
        </div>
        <div class="header-right">
            <button class="btn" onclick="toggleMarket()">MARKET</button>
            <button class="btn" onclick="toggleInventory()">ENVANTER</button>
            <button class="btn" onclick="openSettings()">AYARLAR</button>
        </div>
    </header>

    <!-- Kayan Market Paneli -->
    <div id="market-panel">
        <h3>Market (Ücretsiz Creative Eşyaları)</h3>
        <div class="market-grid" id="market-grid-items"></div>
    </div>

    <!-- Açılır Envanter Paneli -->
    <div id="inventory-panel">
        <h3>Envanterim</h3>
        <div class="market-grid" id="inventory-grid-items"></div>
    </div>

    <!-- Ana Lobi Görünümü -->
    <main id="lobby-view">
        <h1 id="main-heading">Welcome to the learn and play and learn app</h1>
        <p style="margin: 15px 0; color: #94a3b8;">Parti oluştur, arkadaşlarınla oyna veya yapay zekaya meydan oku!</p>
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
            <button class="btn" onclick="openPlayMenu()" style="padding: 12px 30px; font-size: 1.2rem;">PLAY</button>
            <button class="btn" onclick="openLearnMenu()" style="padding: 12px 30px; font-size: 1.2rem;">LEARN</button>
        </div>
    </main>

    <!-- Oyun Seçim Ekranı -->
    <main id="play-modes-view" style="display: none;">
        <h2>Oyun Modunu Seç</h2>
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 25px;">
            <button class="btn" onclick="startRocketGame()" style="padding: 12px 24px;">Roket Oyunu</button>
            <button class="btn" onclick="startFightingGame()" style="padding: 12px 24px;">Dövüş Oyunu</button>
            <button class="btn" onclick="backToLobby()" style="background-color: #64748b; padding: 12px 24px;">Geri</button>
        </div>
    </main>

    <!-- Roket Oyunu Ekranı -->
    <div id="rocket-game-wrapper" class="game-wrapper">
        <div style="position: relative;">
            <canvas id="rocketCanvas" width="600" height="400"></canvas>
            <div id="try-again-container" style="display:none; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); text-align:center;">
                <h2 style="color: #ef4444; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">ÇARPIŞMA!</h2>
                <button class="btn" onclick="resetRocketGame()" style="font-size: 1.4rem; padding: 12px 28px;">TRY AGAIN</button>
            </div>
        </div>
        <div class="touch-controls">
            <div class="touch-group">
                <button class="touch-btn" onmousedown="rocketMoveLeft=true" onmouseup="rocketMoveLeft=false" ontouchstart="rocketMoveLeft=true" ontouchend="rocketMoveLeft=false">◀</button>
                <button class="touch-btn" onmousedown="rocketMoveRight=true" onmouseup="rocketMoveRight=false" ontouchstart="rocketMoveRight=true" ontouchend="rocketMoveRight=false">▶</button>
            </div>
            <button class="btn" onclick="backToPlayModes()" style="background-color: #64748b;">Çıkış</button>
        </div>
    </div>

    <!-- Dövüş Oyunu Ekranı -->
    <div id="fighting-game-wrapper" class="game-wrapper">
        <canvas id="fightCanvas" width="600" height="400"></canvas>
        <div class="touch-controls">
            <div class="touch-group">
                <button class="touch-btn" onmousedown="fightMoveLeft=true" onmouseup="fightMoveLeft=false" ontouchstart="fightMoveLeft=true" ontouchend="fightMoveLeft=false">◀</button>
                <button class="touch-btn" onmousedown="fightMoveRight=true" onmouseup="fightMoveRight=false" ontouchstart="fightMoveRight=true" ontouchend="fightMoveRight=false">▶</button>
            </div>
            <button class="touch-btn" style="background-color: #dc2626;" onclick="fightAttackAction()">VUR</button>
            <button class="btn" onclick="backToPlayModes()" style="background-color: #64748b;">Çıkış</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let isCreativePlayer = false;

        function handleAccountSubmit() {
            const val = document.getElementById('username-input').value.trim();
            if(!val) return;
            currentUser = val;
            if(val.toLowerCase() === "creative player") {
                startCreativeTest(0);
            } else {
                finalizeLogin(false);
            }
        }

        function startCreativeTest(step) {
            const modalTitle = document.getElementById('modal-title');
            const modalDesc = document.getElementById('modal-desc');
            document.getElementById('username-input').style.display = 'none';
            
            let html = '';
            if(step === 0) {
                modalTitle.innerText = "Creative Player Testi (1/3)";
                modalDesc.innerText = "En sevdiği renk ne?";
                html = `<div class="options-grid"><button class="btn" onclick="checkTestAnswer(0, 'gri')">Gri</button><button class="btn" onclick="checkTestAnswer(0, 'mavi')">Mavi</button><button class="btn" onclick="checkTestAnswer(0, 'kirmizi')">Kırmızı</button><button class="btn" onclick="checkTestAnswer(0, 'sari')">Sarı</button></div>`;
            } else if(step === 1) {
                modalTitle.innerText = "Creative Player Testi (2/3)";
                modalDesc.innerText = "Creative player'ın en sevdiği oyun?";
                html = `<div class="options-grid"><button class="btn" style="background:#16a34a;" onclick="checkTestAnswer(1, 'minecraft')">Minecraft</button><button class="btn" style="background:#dc2626;" onclick="checkTestAnswer(1, 'amongus')">Among Us</button><button class="btn" style="background:#db2777;" onclick="checkTestAnswer(1, 'roblox')">Roblox</button><button class="btn" style="background:#ca8a04;" onclick="checkTestAnswer(1, 'fortnite')">Fortnite</button></div>`;
            } else if(step === 2) {
                modalTitle.innerText = "Creative Player Testi (3/3)";
                modalDesc.innerText = "Creative player'ın en sevdiği nesne?";
                html = `<div class="options-grid"><button class="btn" style="background:#2563eb;" onclick="checkTestAnswer(2, 'yastik')">Yastık</button><button class="btn" style="background:#2563eb;" onclick="checkTestAnswer(2, 'yatak')">Yatak</button><button class="btn" style="background:#2563eb;" onclick="checkTestAnswer(2, 'masa')">Masa</button><button class="btn" style="background:#2563eb;" onclick="checkTestAnswer(2, 'sandalye')">Sandalye</button></div>`;
            }
            let gridDiv = document.getElementById('test-options-container') || document.createElement('div');
            gridDiv.id = 'test-options-container';
            modalDesc.after(gridDiv);
            gridDiv.innerHTML = html;
        }

        function checkTestAnswer(step, answer) {
            if(step === 0 && (answer === 'gri' || answer === 'mavi')) startCreativeTest(1);
            else if(step === 1 && (answer === 'minecraft' || answer === 'amongus')) startCreativeTest(2);
            else if(step === 2 && (answer === 'yastik' || answer === 'yatak')) { isCreativePlayer = true; finalizeLogin(true); }
            else { alert("Yanlış cevap! E-posta ve doğum tarihi doğrulaması gerekiyor."); location.reload(); }
        }

        function finalizeLogin(creative) {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('welcome-display').innerText = creative ? `Welcome Yaratan Kişi (${currentUser})` : `Welcome ${currentUser}`;
            document.getElementById('main-heading').innerText = `Welcome to the learn and play and learn app, ${currentUser}!`;
            initMarket();
        }

        let marketItems = [
            { id: 1, name: "Altın Roket Kaplaması", price: "ÜCRETSİZ" },
            { id: 2, name: "Ateş Efekti", price: "ÜCRETSİZ" },
            { id: 3, name: "Neon Kostüm", price: "ÜCRETSİZ" }
        ];
        let inventory = [];

        function initMarket() { renderMarket(); }
        function renderMarket() {
            const container = document.getElementById('market-grid-items');
            container.innerHTML = '';
            marketItems.forEach((item, index) => {
                container.innerHTML += `<div class="market-item"><p><b>${item.name}</b></p><p style="font-size:0.8rem; color:#3b82f6; margin:5px 0;">${item.price}</p><button class="btn" onclick="buyItem(${index})">Al</button></div>`;
            });
        }

        function buyItem(index) {
            const purchased = marketItems[index];
            inventory.push(purchased);
            marketItems[index] = { id: Math.random(), name: "Rastgele Eşya #" + Math.floor(Math.random() * 100), price: "ÜCRETSİZ" };
            renderMarket(); renderInventory();
            alert(purchased.name + " envanterine eklendi!");
        }

        function renderInventory() {
            const container = document.getElementById('inventory-grid-items');
            container.innerHTML = inventory.length === 0 ? "<p>Envanter boş</p>" : "";
            inventory.forEach((item, idx) => {
                container.innerHTML += `<div class="market-item"><p><b>${item.name}</b></p><p style="font-size:0.8rem; color:#22c55e;">Kullanılıyor</p><button class="btn" style="background:#dc2626;" onclick="removeItem(${idx})">Çıkart</button></div>`;
            });
        }
        function removeItem(idx) { inventory.splice(idx, 1); renderInventory(); }

        function toggleMarket() { document.getElementById('market-panel').classList.toggle('active'); document.getElementById('inventory-panel').classList.remove('active'); }
        function toggleInventory() { document.getElementById('inventory-panel').classList.toggle('active'); document.getElementById('market-panel').classList.remove('active'); }
        function openSettings() { alert("Ayarlar: Müzik ve Dondurma Gücü aktif."); }
        function openPlayMenu() { document.getElementById('lobby-view').style.display = 'none'; document.getElementById('play-modes-view').style.display = 'flex'; }
        function openLearnMenu() { alert("Learn seçenekleri henüz güncellenmedi. Lütfen learn seçenekleri güncellenince uygulamaya gelip tekrar deneyiniz."); }
        function backToLobby() { document.getElementById('play-modes-view').style.display = 'none'; document.getElementById('lobby-view').style.display = 'flex'; }
        function backToPlayModes() {
            document.getElementById('rocket-game-wrapper').style.display = 'none';
            document.getElementById('fighting-game-wrapper').style.display = 'none';
            document.getElementById('play-modes-view').style.display = 'flex';
            cancelAnimationFrame(rocketAnimId);
            cancelAnimationFrame(fightAnimId);
        }

        // --- ROKET OYUNU MOTORU ---
        let rocketCanvas, rocketCtx, rocketX = 275, rocketMoveLeft = false, rocketMoveRight = false, asteroids = [], rocketRunning = false, rocketAnimId;

        function startRocketGame() {
            document.getElementById('play-modes-view').style.display = 'none';
            document.getElementById('rocket-game-wrapper').style.display = 'flex';
            document.getElementById('try-again-container').style.display = 'none';
            rocketCanvas = document.getElementById('rocketCanvas');
            rocketCtx = rocketCanvas.getContext('2d');
            rocketX = 275;
            asteroids = [
                {x: 100, y: -50, speed: 3},
                {x: 300, y: -150, speed: 4},
                {x: 450, y: -250, speed: 3.5}
            ];
            rocketRunning = true;
            runRocketLoop();
        }

        function resetRocketGame() {
            rocketX = 275;
            asteroids = [
                {x: 100, y: -50, speed: 3},
                {x: 300, y: -150, speed: 4},
                {x: 450, y: -250, speed: 3.5}
            ];
            document.getElementById('try-again-container').style.display = 'none';
            rocketRunning = true;
            runRocketLoop();
        }

        function runRocketLoop() {
            if (!rocketRunning) return;

            if (rocketMoveLeft && rocketX > 10) rocketX -= 6;
            if (rocketMoveRight && rocketX < 540) rocketX += 6;

            rocketCtx.clearRect(0, 0, 600, 400);

            // Yıldız arkaplan efekti
            rocketCtx.fillStyle = "#ffffff";
            rocketCtx.fillRect(150, 50, 2, 2);
            rocketCtx.fillRect(400, 120, 2, 2);
            rocketCtx.fillRect(250, 300, 3, 3);

            // Roket çizimi
            rocketCtx.fillStyle = "#3b82f6";
            rocketCtx.fillRect(rocketX, 330, 50, 45);
            rocketCtx.fillStyle = "#ef4444";
            rocketCtx.beginPath();
            rocketCtx.moveTo(rocketX, 330);
            rocketCtx.lineTo(rocketX + 25, 300);
            rocketCtx.lineTo(rocketX + 50, 330);
            rocketCtx.fill();

            // Asteroidler
            rocketCtx.fillStyle = "#f97316";
            for (let i = 0; i < asteroids.length; i++) {
                asteroids[i].y += asteroids[i].speed;
                
                rocketCtx.beginPath();
                rocketCtx.arc(asteroids[i].x, asteroids[i].y, 20, 0, Math.PI * 2);
                rocketCtx.fill();

                // Çarpışma Tespiti (Collision)
                if (rocketX < asteroids[i].x + 20 && rocketX + 50 > asteroids[i].x - 20 &&
                    330 < asteroids[i].y + 20 && 375 > asteroids[i].y - 20) {
                    rocketRunning = false;
                    document.getElementById('try-again-container').style.display = 'block';
                }

                // Ekran dışına çıkınca yeniden başlat
                if (asteroids[i].y > 430) {
                    asteroids[i].y = -50;
                    asteroids[i].x = Math.random() * 540 + 30;
                    asteroids[i].speed = 3 + Math.random() * 3;
                }
            }

            if (rocketRunning) {
                rocketAnimId = requestAnimationFrame(runRocketLoop);
            }
        }

        // --- DÖVÜŞ OYUNU MOTORU ---
        let fightCanvas, fightCtx, pX = 100, aiX = 420, pHP = 100, aiHP = 100, fightMoveLeft = false, fightMoveRight = false, fightAnimId;

        function startFightingGame() {
            document.getElementById('play-modes-view').style.display = 'none';
            document.getElementById('fighting-game-wrapper').style.display = 'flex';
            fightCanvas = document.getElementById('fightCanvas');
            fightCtx = fightCanvas.getContext('2d');
            pX = 100; aiX = 420; pHP = 100; aiHP = 100;
            runFightLoop();
        }

        function runFightLoop() {
            if (fightMoveLeft && pX > 0) pX -= 4;
            if (fightMoveRight && pX < aiX - 40) pX += 4;

            // Yapay zeka botunun oyuncuyu takip etmesi
            if (aiX > pX + 50) aiX -= 1.5;
            else if (aiX < pX - 50) aiX += 1.5;

            fightCtx.clearRect(0, 0, 600, 400);

            // Zemin
            fightCtx.fillStyle = "#1e293b";
            fightCtx.fillRect(0, 340, 600, 60);

            // Oyuncu (Yeşil)
            fightCtx.fillStyle = "#22c55e";
            fightCtx.fillRect(pX, 280, 45, 60);
            fightCtx.fillStyle = "#ffffff";
            fightCtx.font = "14px sans-serif";
            fightCtx.fillText("SEN", pX + 8, 270);

            // Bot (Kırmızı)
            fightCtx.fillStyle = "#dc2626";
            fightCtx.fillRect(aiX, 280, 45, 60);
            fightCtx.fillText("BOT", aiX + 8, 270);

            // Can Barları UI
            fightCtx.fillStyle = "#334155";
            fightCtx.fillRect(30, 20, 200, 20);
            fightCtx.fillRect(370, 20, 200, 20);

            fightCtx.fillStyle = "#22c55e";
            fightCtx.fillRect(30, 20, pP * 2, 20); // pHP
            fightCtx.fillStyle = "#dc2626";
            fightCtx.fillRect(370, 20, aiHP * 2, 20);

            fightCtx.fillStyle = "#ffffff";
            fightCtx.fillText("Can: " + pHP, 35, 35);
            fightCtx.fillText("Bot Can: " + aiHP, 375, 35);

            fightAnimId = requestAnimationFrame(runFightLoop);
        }

        function fightAttackAction() {
            // Vurma menzili içindeyse bota hasar ver
            if (Math.abs(pX - aiX) < 70) {
                aiHP -= 15;
                if (aiHP <= 0) {
                    alert("Tebrikler, dövüşü kazandın!");
                    aiHP = 100;
                    pHP = 100;
                }
            }
        }

        // pHP helper
        Object.defineProperty(window, 'pP', { get: function() { return Math.max(0, pHP); } });
    </script>
</body>
</html>
